let dbPromise=null;function db(){if(!('indexedDB' in window))return Promise.reject(new Error('当前浏览器不支持 IndexedDB'));if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('mimu-attachments',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('assets'))d.createObjectStore('assets',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise};
async function setAsset(key,blob,name){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('assets','readwrite');t.objectStore('assets').put({id:key,blob,name});t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
async function getAsset(key){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('assets','readonly');const r=t.objectStore('assets').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
const objectUrls=new Map();async function assetURL(key){if(objectUrls.has(key))return objectUrls.get(key);const asset=await getAsset(key);if(!asset)return null;const u=URL.createObjectURL(asset.blob);objectUrls.set(key,u);return u}

function getList(){const {tab,filter,sort,search}=state;let items=state.data[tab==='wish'?'wishes':tab==='files'?'files':'repos'].slice();if(tab==='wish'&&filter!=='全部')items=items.filter(x=>x.category===filter);if(tab==='files'&&filter!=='全部')items=items.filter(x=>x.type===filter);if(tab==='repo'&&filter!=='全部')items=items.filter(x=>fileBy(x.fileId)?.type===filter);if(search.trim()){const key=search.trim().toLowerCase();items=items.filter(x=>[x.title,x.desc,x.author,...(x.tags||[])].some(s=>String(s||'').toLowerCase().includes(key)))}if(sort==='popular')items.sort((a,b)=>likesCount(tab==='wish'?'wish':tab,a)<likesCount(tab==='wish'?'wish':tab,b)?1:-1);else items.sort((a,b)=>String(b.created).localeCompare(String(a.created)));return items}

let pendingFile=null,pendingImages=[];
function createForm(kind='wish'){if(!['wish','files','repo'].includes(kind))kind='wish';state.modalTab=kind;pendingFile=null;pendingImages=[];const tabs=[['wish','🌠 许愿'],['files','🎀 分享作品'],['repo','💌 发 Repo']];const content=kind==='wish'?`<div class="form-field"><label class="form-label" for="postTitle">心愿标题 *</label><input class="form-input" id="postTitle" maxlength="60" placeholder="想要一个什么样的小惊喜？" required></div><div class="form-field"><label class="form-label" for="postDesc">展开说说 *</label><textarea id="postDesc" class="form-textarea" maxlength="1000" placeholder="想要的色彩、氛围、功能……写得越具体越好。" required></textarea></div><div class="form-row"><div class="form-field"><label class="form-label" for="postCategory">心愿分类</label><select id="postCategory" class="form-select"><option>CSS 美化</option><option>世界书</option><option>资源 / 模板</option><option>HTML / 组件</option></select></div><div class="form-field"><label class="form-label" for="postTags">关键词</label><input id="postTags" class="form-input" maxlength="70" placeholder="复古, 暖色, 手帐"></div></div>`:kind==='files'?`<div class="form-field"><label class="form-label" for="postTitle">作品名称 *</label><input id="postTitle" class="form-input" maxlength="60" placeholder="给你的作品起个可爱的名字" required></div><div class="form-field"><label class="form-label" for="postDesc">作品介绍 *</label><textarea id="postDesc" class="form-textarea" maxlength="1500" placeholder="适用范围、安装方法、有什么特点……" required></textarea></div><div class="form-row"><div class="form-field"><label class="form-label" for="postCategory">作品类型</label><select id="postCategory" class="form-select"><option>CSS 美化</option><option>世界书</option><option>资源 / 模板</option><option>HTML / 组件</option></select></div><div class="form-field"><label class="form-label" for="postTags">关键词</label><input id="postTags" class="form-input" maxlength="70" placeholder="梦核, 紫色, 星星"></div></div><div class="form-field"><label class="form-label">封面色系</label><div class="swatches">${['moon','rose','mint','coffee','lavender','butter','blue'].map((theme,i)=>`<button type="button" class="swatch theme-${theme} ${i===0?'chosen':''}" data-action="swatch" data-theme="${theme}" aria-label="${theme} 色系"></button>`).join('')}</div></div><div class="form-field"><label class="form-label">上传作品文件 *</label><div class="upload-box" id="uploadZone"><span class="upload-emoji">☁️</span><strong>选择文件，或拖拽到这里</strong><p>支持 CSS / JSON / TXT / HTML / ZIP / MD，最多 15 MB</p><input type="file" id="fileInput" accept=".css,.json,.txt,.html,.htm,.zip,.md" aria-label="上传作品文件"></div><div id="fileSelected" class="file-selected"></div></div>`:`<div class="form-field"><label class="form-label" for="postTitle">Repo 标题 *</label><input id="postTitle" class="form-input" maxlength="65" placeholder="今天想分享什么使用感受？" required></div><div class="form-field"><label class="form-label" for="postDesc">说说你的使用体验 *</label><textarea id="postDesc" class="form-textarea" maxlength="1500" placeholder="喜欢的地方、使用的小故事、想对创作者说的话……" required></textarea></div><div class="form-field"><label class="form-label" for="linkedFile">关联作品（可选）</label><select id="linkedFile" class="form-select"><option value="">不关联作品，也分享我的心动</option>${state.data.files.map(f=>`<option value="${esc(f.id)}" ${state.fileRef===f.id?'selected':''}>${esc(f.title)}</option>`).join('')}</select></div><div class="form-field"><label class="form-label">晒出聊天截图（最多 5 张）</label><div class="upload-box" id="uploadZone"><span class="upload-emoji">📷</span><strong>选择截图，或直接拖拽图片</strong><p>支持 JPG / PNG / WEBP，将自动压缩为 WebP</p><input type="file" id="imagesInput" accept="image/*" multiple aria-label="上传使用截图"></div><div class="image-picker-previews" id="imagePreviews"></div><p class="form-note">图片暂存当前浏览器，之后可以接入免费图床，自动转换为图片链接。</p></div><div class="form-field"><label class="form-label" for="imageUrlInput">或粘贴外部图片链接（可选）</label><textarea id="imageUrlInput" class="form-textarea" style="min-height:69px" placeholder="https://example.com/my-screenshot.webp&#10;每行一张，可用已有图床地址"></textarea><p class="form-note">链接不会占用本站文件存储，但如果图床删除图片或禁止外链，图片将无法显示。请勿粘贴隐私照片链接。</p></div>`;
openModal(`<div class="modal-head"><div class="eyebrow">SEND A LITTLE LETTER ✦</div><h2>来投递一份小小心动</h2><p class="hint">用自己喜欢的方式参与社区，匿名也没关系 ♡</p></div><div class="modal-tabs">${tabs.map(t=>`<button type="button" data-action="switchForm" data-kind="${t[0]}" class="${kind===t[0]?'active':''}">${t[1]}</button>`).join('')}</div><form id="publishForm" data-kind="${kind}">${content}<div class="form-actions"><small>✧ 仅在此浏览器保存，本地演示不会公开发布</small><button type="submit" class="btn btn-primary" id="submitPost">确认发布 ${ic('arrow','tiny-icon')}</button></div></form>`);
}
function val(key){return ($(`#${key}`)?.value||'').trim()}
function tagsValue(){return val('postTags').split(/[,，、#]/).map(x=>x.trim()).filter(Boolean).slice(0,6)}
function imageLinks(){const urls=val('imageUrlInput').split(/[\n,，]+/).map(x=>x.trim()).filter(Boolean);if(urls.length>5)throw Error('最多添加 5 个图片链接');for(const url of urls){try{const parsed=new URL(url);if(parsed.protocol!=='https:')throw Error('只支持 https 图片链接')}catch(e){throw Error('请检查图片链接，必须是 https 开头的完整地址')}}return urls}
function validFile(file){if(!file)return false;const ext=file.name.split('.').pop()?.toLowerCase();return ['css','json','txt','html','htm','zip','md'].includes(ext)&&file.size<=15*1024*1024}
function updateFile(file){if(!file)return; if(!validFile(file)){toast('请选择不超过 15 MB 的 CSS、JSON、TXT、HTML、ZIP 或 MD 文件');return}pendingFile=file;$('#fileSelected').textContent=`✓ ${file.name} · ${(file.size/1024).toFixed(1)} KB`}
async function compressImage(file){if(!file.type.startsWith('image/'))throw Error('不支持的图片格式');if(file.size>20*1024*1024)throw Error('单张原图不能超过 20 MB');return new Promise((resolve,reject)=>{const img=new Image();const temp=URL.createObjectURL(file);img.onload=()=>{try{const canvas=document.createElement('canvas');const scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{URL.revokeObjectURL(temp);if(blob)resolve(blob);else reject(Error('压缩图片失败'))},'image/webp',.78)}catch(e){URL.revokeObjectURL(temp);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(temp);reject(Error('图片读取失败'))};img.src=temp})}
async function updateImages(files){const allowed=Math.max(0,5-pendingImages.length);const selected=Array.from(files).slice(0,allowed);for(const f of selected){try{const blob=await compressImage(f);pendingImages.push({blob,preview:URL.createObjectURL(blob)})}catch(e){toast(e.message)}}const target=$('#imagePreviews');if(target)target.innerHTML=pendingImages.map((p,i)=>`<div style="position:relative"><img src="${p.preview}" alt="图片 ${i+1}"><button type="button" data-action="removePreview" data-index="${i}" style="position:absolute;right:-5px;top:-5px;background:#333;color:white;border:0;border-radius:50%;width:20px;height:20px">×</button></div>`).join('')}
function getDemoContent(f){if(f.type==='世界书'||f.type==='资源 / 模板')return JSON.stringify({note:'mimu 网站演示样例，并非正式完整作品',title:f.title,world:{name:'夏日小镇',description:'一个温柔的小小世界',locations:['灯塔','唱片店']}},null,2);if(f.type==='HTML / 组件')return '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>mimu 演示样例</title><body><h1>✿ 你好！这是网站下载功能的演示文件。</h1></body></html>';return `/* mimu 网站演示 CSS · 非完整正式作品\n   ${f.title}\n*/\nbody { background: #faf8f3; color: #333; }\n.chat-bubble { border-radius: 14px; background: #e4d9f4; padding: 12px; }\n`}
async function downloadFile(fid){const f=fileBy(fid);if(!f)return;let blob,filename;if(f.assetId){try{const a=await getAsset(f.assetId);if(!a)throw Error('文件已不存在');blob=a.blob;filename=a.name}catch(e){toast('未找到本地文件：请在上传时的浏览器打开');return}}else{const ext=f.type==='世界书'||f.type==='资源 / 模板'?'json':f.type==='HTML / 组件'?'html':'css';blob=new Blob([getDemoContent(f)],{type:'text/plain;charset=utf-8'});filename='mimu_demo_'+f.id+'.'+ext;toast('这是演示样例文件，不是完整原作')}const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);f.downloads=(f.downloads||0)+1;save();}
async function submitPost(event){event.preventDefault();const kind=$('#publishForm')?.dataset.kind,title=val('postTitle'),desc=val('postDesc');if(!title||!desc){toast('标题和内容都要填写哦');return}if(kind==='files'&&!pendingFile){toast('先选择想要分享的文件吧');return}let links=[];if(kind==='repo'){try{links=imageLinks();if(links.length+pendingImages.length>5){toast('截图和外链总共最多 5 张哦');return}}catch(e){toast(e.message);return}}const btn=$('#submitPost');btn.disabled=true;btn.textContent='正在保存…';try{const today=new Date().toISOString().slice(0,10);if(kind==='wish'){state.data.wishes.unshift({id:'w'+id(),title,desc,author:state.nick,category:val('postCategory')||'CSS 美化',tags:tagsValue(),votes:0,status:'等待认领',created:today})}else if(kind==='files'){const key='asset-'+id();await setAsset(key,pendingFile,pendingFile.name);const theme=$('.swatch.chosen')?.dataset.theme||'moon';state.data.files.unshift({id:'f'+id(),title,desc,author:state.nick,type:val('postCategory')||'CSS 美化',tags:tagsValue(),theme,art:'chat',emoji:'✿',likes:0,downloads:0,version:'v1.0',created:today,assetId:key})}else if(kind==='repo'){const images=[];for(const p of pendingImages){const key='image-'+id();await setAsset(key,p.blob,'repo-image.webp');images.push(key);URL.revokeObjectURL(p.preview)}const fileId=val('linkedFile');state.data.repos.unshift({id:'r'+id(),title,desc,author:state.nick,fileId,theme:fileBy(fileId)?.theme||'rose',likes:0,created:today,images,imageUrls:links})}save();state.fileRef=null;closeModal();toast('投递成功！这份心动已经存进当前浏览器 ✨');setTab(kind==='wish'?'wish':kind)}catch(e){console.error(e);toast('保存失败，可能是浏览器不允许离线存储');btn.disabled=false;btn.textContent='再试一次'}}
function detail(kind,key){const d=state.data;if(kind==='wish'){const w=d.wishes.find(x=>x.id===key);if(!w)return;openModal(`<div class="modal-head"><div class="eyebrow">AN OPEN WISH ✦ ${esc(w.id)}</div><h2>${esc(w.title)}</h2><p class="hint">来自 ${esc(w.author)} · ${displayDate(w.created)}</p></div><div style="display:flex;gap:9px;margin:15px 0 23px"><span class="label pink">${esc(w.category)}</span><span class="label ${badgeStatus(w.status)}">● ${esc(w.status)}</span>${markupTags(w.tags)}</div><div class="detail-body"><p>${esc(w.desc)}</p></div><div class="detail-sep"></div><div class="detail-foot"><button class="like-btn ${liked('wish',w.id)?'liked':''}" data-action="like" data-kind="wish" data-id="${esc(w.id)}">${ic('heart')} ${likesCount('wish',w)} 人想要</button>${w.fileId&&fileBy(w.fileId)?`<button class="btn btn-yellow" data-action="detail" data-kind="files" data-id="${esc(w.fileId)}">查看实现的作品 ${ic('arrow','tiny-icon')}</button>`:''}${w.status==='等待认领'?`<button class="btn btn-soft" data-action="claim" data-id="${esc(w.id)}">✿ 我来认领</button>`:''}</div><p class="form-note" style="margin-top:16px">本地演示中的认领只更新当前浏览器的状态，正式版将加入账户权限和审核。</p>`);return}
if(kind==='files'){const f=fileBy(key);if(!f)return;const related=state.data.repos.filter(r=>r.fileId===f.id);openModal(`<div class="detail-visual">${cover(f)}</div><div class="modal-head"><div class="eyebrow">FILES / ${esc(f.type)}</div><h2>${esc(f.title)}</h2><p class="hint">✿ ${esc(f.author)} · ${esc(f.version||'v1.0')} · ${displayDate(f.created)} · ↓ ${f.downloads||0} 次下载</p></div><div class="detail-body"><p>${esc(f.desc)}</p></div><div class="detail-foot"><button class="btn btn-primary" data-action="download" data-id="${esc(f.id)}">${ic('download','tiny-icon')} ${f.assetId?'下载作品文件':'下载演示样例'}</button><button class="like-btn ${liked('files',f.id)?'liked':''}" data-action="like" data-kind="files" data-id="${esc(f.id)}">${ic('heart')} ${likesCount('files',f)}</button><button class="btn btn-outline btn-small" data-action="repoFor" data-id="${esc(f.id)}">💌 为它写 Repo</button></div>${related.length?`<div class="detail-sep"></div><b style="font-size:14px">来自大家的 Repo · ${related.length} 篇</b><div style="margin-top:11px;display:flex;gap:9px;flex-wrap:wrap">${related.slice(0,5).map(r=>`<button class="chip" data-action="detail" data-kind="repo" data-id="${esc(r.id)}">💌 ${esc(r.title.slice(0,13))}…</button>`).join('')}</div>`:''}<p class="form-note" style="margin-top:18px">${f.assetId?'用户文件仅在上传者的浏览器中可用。':'示例作品仅用于展示页面效果，下载内容是测试用简短样例。'}</p>`);$('.modal')?.classList.add('detail-modal');return}
if(kind==='repo'){const r=d.repos.find(x=>x.id===key);if(!r)return;openModal(`<div class="detail-visual">${repoImage(r)}</div><div class="modal-head"><div class="eyebrow">A LITTLE REPO DIARY</div><h2>${esc(r.title)}</h2><p class="hint">✿ ${esc(r.author)} · ${displayDate(r.created)}</p></div><div class="detail-body"><p>${esc(r.desc)}</p></div>${(r.images?.length||0)+(r.imageUrls?.length||0)>1?`<div class="preview-pictures">${(r.images||[]).map(k=>`<img data-asset-id="${esc(k)}" alt="Repo 附加截图">`).join('')}${(r.imageUrls||[]).map(url=>`<img src="${esc(url)}" referrerpolicy="no-referrer" loading="lazy" alt="Repo 外链截图">`).join('')}</div>`:''}<div class="detail-sep"></div><div class="detail-foot"><button class="like-btn ${liked('repo',r.id)?'liked':''}" data-action="like" data-kind="repo" data-id="${esc(r.id)}">${ic('heart')} ${likesCount('repo',r)}</button>${fileBy(r.fileId)?`<button class="btn btn-soft" data-action="detail" data-kind="files" data-id="${esc(r.fileId)}">${ic('file','tiny-icon')} 关联作品：${esc(fileBy(r.fileId).title.slice(0,14))} ${ic('arrow','tiny-icon')}</button>`:''}</div>`);$('.modal')?.classList.add('detail-modal');hydrateImages($('#modalRoot'))}}
function claimWish(key){const w=state.data.wishes.find(x=>x.id===key);if(!w||w.status!=='等待认领')return;w.status='创作中';w.claimedBy=state.nick;save();detail('wish',key);render(true);toast('认领成功！期待这份小作品 ✿')}
function handleAction(el){const action=el.dataset.action,kind=el.dataset.kind,key=el.dataset.id;if(action==='like'){toggleLike(kind,key);if(state.modal)detail(kind,key)}else if(action==='save'){toggleSave(key)}else if(action==='detail'){detail(kind,key)}else if(action==='create'){createForm(kind||'wish')}else if(action==='dismiss'){closeModal()}else if(action==='switchForm'){createForm(kind)}else if(action==='filter'){state.filter=el.dataset.value;render(true)}else if(action==='swatch'){$$('.swatch').forEach(e=>e.classList.toggle('chosen',e===el))}else if(action==='about'){introModal()}else if(action==='claim'){claimWish(key)}else if(action==='download'){downloadFile(key)}else if(action==='repoFor'){state.fileRef=key;createForm('repo')}else if(action==='removePreview'){const [item]=pendingImages.splice(Number(el.dataset.index),1);if(item)URL.revokeObjectURL(item.preview);updateImages([])}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();setTab(nav.dataset.nav);return}const action=e.target.closest('[data-action]');if(action){e.preventDefault();e.stopPropagation();handleAction(action);return}if(e.target.id==='modalBackdrop')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.file-card[role="button"],.repo-card[role="button"]')){e.preventDefault();detail(e.target.dataset.kind,e.target.dataset.id)}});
document.addEventListener('submit',e=>{if(e.target.id==='publishForm')submitPost(e)});
document.addEventListener('change',e=>{if(e.target.id==='sortSelect'){state.sort=e.target.value;render(true)}else if(e.target.id==='fileInput'){updateFile(e.target.files[0])}else if(e.target.id==='imagesInput'){updateImages(e.target.files);e.target.value=''}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.id==='searchField'){state.search=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const focus=document.activeElement===e.target;const at=e.target.selectionStart;render(true);if(focus){const input=$('#searchField');input.focus();input.setSelectionRange(at,at)}},160)}});
document.addEventListener('dragover',e=>{const zone=e.target.closest('#uploadZone');if(zone){e.preventDefault();zone.classList.add('dragover')}});document.addEventListener('dragleave',e=>{const zone=e.target.closest('#uploadZone');if(zone)zone.classList.remove('dragover')});document.addEventListener('drop',e=>{const zone=e.target.closest('#uploadZone');if(zone){e.preventDefault();zone.classList.remove('dragover');const files=e.dataTransfer.files;const mode=$('#publishForm')?.dataset.kind;if(mode==='repo')updateImages(files);else if(mode==='files')updateFile(files[0])}});
$('#headerCreate').addEventListener('click',()=>createForm('wish'));$('#brand').addEventListener('click',e=>{e.preventDefault();setTab('home')});$('#mobileMenu').addEventListener('click',()=>$('#mainNav').classList.toggle('open'));
window.addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;$('#topProgress').style.width=(max>0?scrollY/max*100:0)+'%'},{passive:true});
window.addEventListener('beforeunload',()=>{for(const url of objectUrls.values())URL.revokeObjectURL(url)});
render();
</script>
</body>
</html>
