function closeModal(){for(const obj of state.images||[]){if(obj.preview?.startsWith('blob:'))URL.revokeObjectURL(obj.preview)}state.images=[];state.file=null;state.modal=false;$('#modalRoot').innerHTML='';document.body.classList.remove('no-scroll')}
function openModal(html,large=false){state.modal=state.modal||{kind:'misc'};$('#modalRoot').innerHTML=`<div class="overlay" id="modalBackdrop"><div class="modal ${large?'large':''}" role="dialog" aria-modal="true" aria-label="弹窗"><button type="button" class="modal-close" data-action="close" aria-label="关闭弹窗">${ic('close')}</button>${html}</div></div>`;document.body.classList.add('no-scroll');hydrate($('#modalRoot'));setTimeout(()=>$('.modal-close')?.focus(),30)}
function createForm(kind='wish',linked=''){if(!['wish','files','repo'].includes(kind))kind='wish';state.images=[];state.file=null;state.theme='mist';if(kind==='repo')state.fileRef=linked||'';state.modal={kind:'create',postKind:kind};const cats=kind==='wish'?pages.wish.categories.slice(1):pages.files.categories.slice(1);const form=`<div class="eyebrow">DEAR MIMU. COMMUNITY · NEW ENTRY</div><h2>${kind==='wish'?'Make a little wish.':kind==='files'?'Share something lovely.':'Leave a little echo.'}</h2><p class="lead">${kind==='wish'?'匿名写下你的灵感，没有小到不值得被认真对待的愿望。':kind==='files'?'上传你的美化、世界书或小工具，让别人也能遇见它。':'聊聊真实的使用感受，晒出自己的聊天截图与创作片段。'}</p><div class="modal-tabbar">${[['wish','许愿 Wish'],['files','作品 Files'],['repo','返图 Repo']].map(([id,name])=>`<button type="button" class="${kind===id?'active':''}" data-action="create" data-kind="${id}">${name}</button>`).join('')}</div><form id="postForm" data-kind="${kind}"><div class="field"><label for="postTitle">标题 *</label><input id="postTitle" maxlength="70" required placeholder="给你的${kind==='wish'?'小愿望':kind==='repo'?'使用故事':'作品'}起个名字"></div><div class="field"><label for="postDesc">${kind==='wish'?'愿望详情':kind==='files'?'作品介绍':'使用感受'} *</label><textarea id="postDesc" maxlength="3000" required placeholder="慢慢写，不急。可以说说你想要的细节……"></textarea></div><div class="form-row"><div class="field"><label for="postAuthor">署名（可选）</label><input id="postAuthor" maxlength="32" placeholder="留空就是匿名访客"></div>${kind==='wish'||kind==='files'?`<div class="field"><label for="postCategory">${kind==='wish'?'愿望分类':'文件分类'}</label><select id="postCategory">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>`:`<div class="field"><label for="linkedFile">关联的作品</label><select id="linkedFile"><option value="">不关联作品</option>${state.data.files.map(f=>`<option value="${esc(f.id)}" ${state.fileRef===f.id?'selected':''}>${esc(f.title)}</option>`).join('')}</select></div>`}</div>${kind==='wish'?`<div class="field"><label for="postTags">灵感标签（可选，以逗号分隔）</label><input id="postTags" maxlength="80" placeholder="例如：复古, 暖色, 手帐"></div>`:''}${kind==='files'?`<div class="field"><label>选择封面色调</label><div class="swatches">${['mist','vintage','night','peach','sage','lavender'].map(t=>`<button type="button" class="swatch ${t===state.theme?'active':''}" data-action="swatch" data-theme="${t}" aria-label="封面色调 ${t}"></button>`).join('')}</div></div><div class="field"><label>上传作品文件 *</label><div class="upload-field" id="uploadZone">${ic('upload')}<strong>点击选择文件或拖入</strong><span id="uploadedName">支持 CSS、JSON、TXT、HTML、ZIP · 最大 10 MB</span><input type="file" id="fileInput" accept=".css,.json,.txt,.html,.zip,.md,.js,.webp,.png,.jpg,.jpeg" aria-label="上传作品文件"></div></div>`:''}${kind==='repo'?`<div class="field"><label>聊天截图 / 使用返图（可选，最多 6 张）</label><div class="upload-field" id="uploadZone">${ic('image')}<strong>点击或拖入照片</strong><span>图片会自动压缩为 WebP，仅存于本机演示版</span><input id="imagesInput" type="file" accept="image/*" multiple aria-label="添加图片"></div><div class="preview-list" id="imagePreviews"></div></div><div class="field"><label for="imageUrls">或粘贴外部图片直链（可选，每行一个）</label><textarea id="imageUrls" placeholder="https://example.com/photo.jpg" style="min-height:74px"></textarea><span class="form-mini">外链不占用本站文件空间，但源图片失效后也会无法显示。</span></div>`:''}<div class="modal-bottom"><span class="form-mini">${kind==='repo'?'公开聊天截图前，请遮盖个人信息并确认有权分享。':'作品将保存在当前浏览器，正式上线后才会公开同步。'}</span><button type="submit" class="solid-button" id="postSubmit">${kind==='wish'?'投递愿望':kind==='files'?'发布文件':'发布 Repo'} ${ic('arrow','icon-sm')}</button></div></form><div class="demo-notice"><b>当前是独立体验版。</b> 投稿只在你的浏览器中可见，不会自动发送给其他人；上线后可接 Supabase 和外部图床。</div>`;openModal(form);setTimeout(()=>$('#postTitle')?.focus(),40)}
function demoFile(f){if(f.type==='世界书')return JSON.stringify({meta:'mimu 演示世界书文件 / 非正式作品',title:f.title,world:{setting:'一个等待被写下故事的小世界',places:['书店','旧唱片店','海边咖啡馆']}},null,2);if(f.type==='HTML / 模板')return `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>${esc(f.title)}</title><style>body{font-family:Georgia,serif;padding:8vw;background:#e5e9df;color:#45554c}</style><body><h1>mimu. sample</h1><p>此文件为界面功能演示，非完整作品。</p></body></html>`;return `/* mimu. editorial 演示下载文件\n * ${f.title}\n * 仅供测试下载，不代表正式作品。\n */\n:root { --bg: #e3e9e5; --bubble: #f7f6f3; }\nbody { background: var(--bg); color: #393735; }\n.chat-bubble { background: var(--bubble); border-radius: 14px; padding: 12px; }`}
async function downloadFile(id){const f=fileBy(id);if(!f)return;try{let blob,filename;if(f.assetId){blob=await readAsset(f.assetId);if(!blob)throw Error('未找到这份文件');filename=f.fileName||'file'}else{blob=new Blob([demoFile(f)],{type:'text/plain;charset=utf-8'});filename=`mimu_sample_${f.id}.${f.type==='世界书'?'json':f.type==='HTML / 模板'?'html':'css'}`;toast('这是用于测试下载功能的示例文件，不是原始作品')}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);f.downloads=(f.downloads||0)+1;persist();}catch(e){toast('下载失败：'+e.message)}}
function detail(kind,id){state.modal={kind,id};if(kind==='wish'){const w=wishBy(id);if(!w)return;openModal(`<div class="eyebrow">AN OPEN WISH / NO. ${esc(w.id)}</div><h2>${esc(w.title)}</h2><p class="lead">${esc(w.author)} · ${formatDate(w.date)}</p><div class="detail-labels"><span class="detail-label">${esc(w.category)}</span><span class="detail-label">${esc(w.status)}</span>${(w.tags||[]).map(t=>`<span class="detail-label"># ${esc(t)}</span>`).join('')}</div><div class="form-divider"></div><p class="detail-text">${esc(w.desc)}</p><div class="detail-actions"><button class="like-control ${liked('wish',w.id)?'active':''}" data-action="like" data-kind="wish" data-id="${esc(w.id)}">${ic('heart')} ${counts('wish',w)} 人也想要</button>${w.fileId&&fileBy(w.fileId)?`<button class="solid-button" data-action="detail" data-kind="files" data-id="${esc(w.fileId)}">查看实现的作品 ${ic('arrow','icon-sm')}</button>`:''}${w.status==='等待实现'?`<button class="line-button" data-action="claim" data-id="${esc(id)}">我想认领这个愿望 ↗</button>`:''}</div><div class="demo-notice">认领仅在当前浏览器生效。正式版需要账号权限与审核管理。</div>`);return}
if(kind==='files'){const f=fileBy(id);if(!f)return;const related=state.data.repos.filter(r=>r.fileId===id);openModal(`<div class="detail-cover">${cover(f)}</div><div class="eyebrow">FROM THE FILE ARCHIVE · ${esc(f.type)}</div><h2>${esc(f.title)}</h2><p class="lead">by ${esc(f.author)} · v${esc(f.version)} · ${formatDate(f.date)} · ${f.downloads||0} downloads</p><p class="detail-text">${esc(f.desc)}</p><div class="detail-actions"><button class="solid-button" data-action="download" data-id="${esc(f.id)}">${ic('download','icon-sm')} ${f.assetId?'下载作品文件':'下载演示样例'}</button><button class="line-button" data-action="repoFor" data-id="${esc(id)}">写使用 Repo ↗</button><button class="like-control ${liked('files',f.id)?'active':''}" data-action="like" data-kind="files" data-id="${esc(f.id)}">${ic('heart','icon-sm')} ${counts('files',f)}</button><button class="like-control ${saved(f.id)?'active':''}" data-action="save" data-id="${esc(f.id)}">${ic('bookmark','icon-sm')} 收藏</button></div><div class="related"><span class="eyebrow dark">RELATED REPO DIARIES / ${related.length}</span>${related.length?`<div>${related.map(r=>`<button data-action="detail" data-kind="repo" data-id="${esc(r.id)}">${esc(r.title)} ↗</button>`).join('')}</div>`:'<p>还没有人返图，来发布第一篇吧。</p>'}</div>${f.sample?'<div class="demo-notice"><b>演示作品：</b>图片和文字是用于展示风格的模拟内容，下载的是短篇测试文件，不是完整原作。</div>':''}`,true);return}
if(kind==='repo'){const r=repoBy(id);if(!r)return;const f=fileBy(r.fileId);const imgs=[...(r.images||[]).map(x=>`<img alt="Repo 附加截图" data-asset="${esc(x)}" loading="lazy">`),...(r.imageUrls||[]).map(url=>`<img alt="Repo 外链截图" src="${esc(url)}" loading="lazy" referrerpolicy="no-referrer">`)];openModal(`<div class="detail-repo-visual">${chatArtwork(r)}</div><div class="eyebrow">A LITTLE REPO DIARY / ${formatDate(r.date)}</div><h2>${esc(r.title)}</h2><p class="lead">来自 ${esc(r.author)}</p><p class="detail-text">${esc(r.desc)}</p>${imgs.length>1?`<div class="detail-images">${imgs.join('')}</div>`:''}<div class="detail-actions"><button class="like-control ${liked('repo',r.id)?'active':''}" data-action="like" data-kind="repo" data-id="${esc(r.id)}">${ic('heart')} ${counts('repo',r)}</button>${f?`<button class="line-button" data-action="detail" data-kind="files" data-id="${esc(f.id)}">关联作品：${esc(f.title)} ↗</button>`:''}</div>` ,true)}}
async function resizeImage(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(Error('只能上传图片'));if(file.size>20*1024*1024)return reject(Error('单张图片不能超过 20 MB'));const img=new Image,url=URL.createObjectURL(file);img.onload=()=>{try{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{URL.revokeObjectURL(url);if(blob)resolve(blob);else reject(Error('图片转换失败'))},'image/webp',.78)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('无法读取图片'))};img.src=url})}
async function processImages(files){const arr=[...files];if(arr.length+state.images.length>6){toast('每篇 Repo 最多添加 6 张截图');return}for(const file of arr){try{const blob=await resizeImage(file);state.images.push({blob,preview:URL.createObjectURL(blob)});}catch(e){toast(e.message)}}previewImages()}
function previewImages(){const dest=$('#imagePreviews');if(!dest)return;dest.innerHTML=state.images.map((x,i)=>`<div class="preview-box"><img src="${esc(x.preview)}" alt="待上传截图"><button type="button" class="preview-remove" data-action="removeImage" data-index="${i}" aria-label="删除截图">×</button></div>`).join('')}
function safeUrls(text){const lines=text.split(/\n/).map(s=>s.trim()).filter(Boolean);if(lines.length>6)throw Error('最多允许 6 条图片外链');for(const line of lines){const u=new URL(line);if(u.protocol!=='https:')throw Error('请使用 https 图片直链');if(u.username||u.password)throw Error('图片链接格式不正确')}return lines}
async function submitPost(e){e.preventDefault();const form=e.target,kind=form.dataset.kind,title=$('#postTitle')?.value.trim(),desc=$('#postDesc')?.value.trim(),author=$('#postAuthor')?.value.trim()||'匿名访客';if(!title||!desc){toast('标题和内容都需要填写');return}if(kind==='files'&&!state.file){toast('请先选择作品文件');return}const button=$('#postSubmit');button.disabled=true;button.textContent='正在保存…';try{const id=(kind==='wish'?'w':kind==='files'?'f':'r')+uid(),date=toDate();if(kind==='wish'){state.data.wishes.unshift({id,title,desc,author,category:$('#postCategory').value,tags:$('#postTags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean).slice(0,5),votes:0,date,status:'等待实现'});}else if(kind==='files'){const key='file-'+uid();await saveAsset(key,state.file);state.data.files.unshift({id,title,desc,author,type:$('#postCategory').value,theme:state.theme,coverTitle:title.slice(0,18),coverSub:'shared with love',date,version:'1.0',likes:0,downloads:0,assetId:key,fileName:state.file.name,sample:false})}else if(kind==='repo'){const urls=safeUrls($('#imageUrls').value.trim());if(urls.length+state.images.length>6)throw Error('图片与外链总数不能超过 6 张');const keys=[];for(const img of state.images){const key='img-'+uid();await saveAsset(key,img.blob);keys.push(key)}state.data.repos.unshift({id,title,desc,author,likes:0,fileId:$('#linkedFile').value||'',tone:state.theme==='mist'?'rose':state.theme,chat:['收藏今天的小小瞬间。','分享一份真正的喜欢。'],images:keys,imageUrls:urls,date});}persist();closeModal();navigate(kind);toast('投稿成功，已经保存到这个浏览器 ♡');}catch(e){console.error(e);toast('保存失败：'+(e.message||'请重试'));button.disabled=false;button.textContent='重新发布'}}
function about(){state.modal={kind:'about'};openModal(`<div class="eyebrow">ABOUT MIMU. / OUR LITTLE CORNER</div><h2>Made for little things,<br>and lovely people.</h2><p class="lead">mimu. 是一个围绕美化、世界书、创作文件与真实使用 Repo 的小小社区概念。</p><div class="form-divider"></div><p class="detail-text">WISH / 把想要的内容写成愿望。\n\nFILES / 分享自己的 CSS、世界书、模板等文件。\n\nREPO / 晒出实际使用的返图、截图和体验，关联喜欢的作品。</p><div class="demo-notice"><b>这是杂志风独立体验版。</b> 图片、示例帖子均为虚构演示内容；本地发布的内容只存储在当前浏览器，不会同步给其他人。要正式上线需要连接数据库、对象存储与审核机制。请勿在演示版存放重要私人文件。</div>`) }
function handleAction(el){const action=el.dataset.action,kind=el.dataset.kind,id=el.dataset.id;if(action==='create'){createForm(kind||'wish')}else if(action==='detail'){detail(kind,id)}else if(action==='like'){toggleLike(kind,id)}else if(action==='save'){toggleSave(id)}else if(action==='close'){closeModal()}else if(action==='download'){downloadFile(id)}else if(action==='repoFor'){closeModal();createForm('repo',id)}else if(action==='filter'){state.filter=el.dataset.value;render(true)}else if(action==='claim'){const w=wishBy(id);if(w&&w.status==='等待实现'){w.status='创作中';persist();render(true);detail('wish',id);toast('愿望已认领（本地演示）')}}else if(action==='swatch'){state.theme=el.dataset.theme;$$('.swatch').forEach(x=>x.classList.toggle('active',x.dataset.theme===state.theme))}else if(action==='removeImage'){const ix=Number(el.dataset.index);const item=state.images.splice(ix,1)[0];if(item)URL.revokeObjectURL(item.preview);previewImages()}else if(action==='about'){about()}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();navigate(nav.dataset.nav);return}const action=e.target.closest('[data-action]');if(action){e.preventDefault();handleAction(action);return}if(e.target.id==='modalBackdrop')closeModal()});
document.addEventListener('submit',e=>{if(e.target.id==='postForm')submitPost(e)});
document.addEventListener('change',e=>{if(e.target.id==='sortInput'){state.sort=e.target.value;render(true)}else if(e.target.id==='fileInput'){const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024){toast('作品文件不能超过 10 MB');e.target.value='';return}state.file=f;$('#uploadedName').textContent=`已选择：${f.name} · ${(f.size/1024).toFixed(0)} KB`;$('#uploadedName').classList.add('upload-file-name')}else if(e.target.id==='imagesInput'){processImages(e.target.files);e.target.value=''}});
let debounce;document.addEventListener('input',e=>{if(e.target.id!=='searchInput')return;state.search=e.target.value;const pos=e.target.selectionStart;clearTimeout(debounce);debounce=setTimeout(()=>{render(true);const i=$('#searchInput');if(i){i.focus();i.setSelectionRange(pos,pos)}},220)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal()});
document.addEventListener('dragover',e=>{const zone=e.target.closest('#uploadZone');if(zone){e.preventDefault();zone.classList.add('drag')}});document.addEventListener('dragleave',e=>{const zone=e.target.closest('#uploadZone');if(zone)zone.classList.remove('drag')});document.addEventListener('drop',e=>{const zone=e.target.closest('#uploadZone');if(!zone)return;e.preventDefault();zone.classList.remove('drag');const kind=$('#postForm')?.dataset.kind;if(kind==='repo')processImages(e.dataTransfer.files);else if(kind==='files'){const f=e.dataTransfer.files[0];if(!f)return;if(f.size>10*1024*1024){toast('文件不得超过 10MB');return}state.file=f;$('#uploadedName').textContent='已选择：'+f.name}});
$('#searchShortcut').addEventListener('click',()=>{navigate('files');setTimeout(()=>$('#searchInput')?.focus(),60)});
window.addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;$('#scrollLine').style.width=(max>0?Math.min(100,100*scrollY/max):0)+'%'},{passive:true});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['home','wish','files','repo'].includes(v)&&state.tab!==v)navigate(v)});
window.addEventListener('beforeunload',()=>{for(const url of objectUrls.values())URL.revokeObjectURL(url)});
render();
</script>
</body>
